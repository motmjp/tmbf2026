const storageKey='jp-opsalg-session-v1:'+encrypted.salt;
const decode=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const encode=b=>btoa(String.fromCharCode(...new Uint8Array(b)));
const $=id=>document.getElementById(id);
async function derive(password){const material=await crypto.subtle.importKey('raw',new TextEncoder().encode(password),'PBKDF2',false,['deriveBits']);return new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2',salt:decode(encrypted.salt),iterations:600000,hash:'SHA-256'},material,256));}
async function reveal(raw){const key=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);const plaintext=await crypto.subtle.decrypt({name:'AES-GCM',iv:decode(encrypted.iv)},key,decode(encrypted.data));$('guide').srcdoc=new TextDecoder().decode(plaintext);$('login').hidden=true;$('app').hidden=false;$('password').value='';try{sessionStorage.setItem(storageKey,encode(raw));}catch{} }
$('unlock').addEventListener('submit',async event=>{event.preventDefault();$('submit').disabled=true;$('message').textContent='Åbner guiden…';try{await reveal(await derive($('password').value));$('message').textContent='';}catch{$('message').textContent='Forkert adgangskode. Prøv igen.';$('password').focus();}finally{$('submit').disabled=false;}});
$('logout').addEventListener('click',()=>{try{sessionStorage.removeItem(storageKey);}catch{}$('guide').removeAttribute('srcdoc');$('app').hidden=true;$('login').hidden=false;$('password').value='';$('password').focus();});
(async()=>{if(!globalThis.crypto?.subtle){$('message').textContent='Åbn siden via HTTPS i en opdateret browser.';$('submit').disabled=true;return;}try{const saved=sessionStorage.getItem(storageKey);if(saved)await reveal(decode(saved));}catch{try{sessionStorage.removeItem(storageKey);}catch{}}})();
